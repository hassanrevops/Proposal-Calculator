<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manual Proposal — KnowledgeCity QuoteHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/img/kc-icon.png">
<link rel="stylesheet" href="/styles.css?v=28">
<script src="/preview.js?v=18" defer></script>
</head>
<body>
<button class="theme-toggle-fab" id="themeToggle" data-icon="moon" aria-label="Switch to dark mode"></button>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" data-variant="public" data-nav="manual"></aside>

  <main class="main" data-footer="confidential">
    <div class="hero">
      <div class="hero-badge">KnowledgeCity</div>
      <h1>Manual Proposal</h1>
      <p>Every figure is editable — the engine fills in defaults you can override, since this path exists for deals negotiated outside the standard pricing rules.</p>
    </div>

    <div class="content-columns">
      <div class="form-column">
        <form id="proposalForm">
          <div class="section-title">Client</div>
          <div class="row">
            <div class="field"><label>Company name</label><input type="text" id="companyName" required></div>
          </div>
          <div class="row">
            <div class="field"><label>Proposal date</label><input type="date" id="proposalDate"></div>
            <div class="field"><label>Currency</label>
              <div class="currency-combo" id="currencyCombo">
                <input type="text" id="currencySearch" placeholder="Search currency..." autocomplete="off">
                <input type="hidden" id="currencyCode" value="USD">
                <div class="currency-dropdown"></div>
              </div>
            </div>
          </div>

          <div class="section-title">Pricing Slides</div>
          <div id="slidesContainer"></div>

          <div class="form-actions">
            <button type="button" class="btn btn-outline btn-block" id="addSlideBtn">+ Add another pricing slide</button>
            <button type="submit" class="btn btn-primary btn-block">Generate Proposal</button>
          </div>
        </form>
      </div>

      <div class="preview-column">
        <div id="previewContainer">
          <div class="preview-empty-hint">Enter licenses and pricing to see the pricing slide appear here.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<button class="calc-fab" id="calcFab" title="Calculator" data-icon="calc"></button>
<div class="calc-window" id="calcWindow">
  <div class="calc-titlebar"><span>Calculator</span><button type="button" class="calc-close" aria-label="Close calculator">✕</button></div>
  <div class="calc-display">0</div>
  <div class="calc-keys">
    <button type="button" class="calc-clear" data-clear>C</button>
    <button type="button" class="calc-op" data-percent>%</button>
    <button type="button" class="calc-op" data-op="/">÷</button>
    <button type="button" class="calc-op" data-op="*">×</button>
    <button type="button" data-digit="7">7</button>
    <button type="button" data-digit="8">8</button>
    <button type="button" data-digit="9">9</button>
    <button type="button" class="calc-op" data-op="-">−</button>
    <button type="button" data-digit="4">4</button>
    <button type="button" data-digit="5">5</button>
    <button type="button" data-digit="6">6</button>
    <button type="button" class="calc-op calc-tall" data-op="+">+</button>
    <button type="button" data-digit="1">1</button>
    <button type="button" data-digit="2">2</button>
    <button type="button" data-digit="3">3</button>
    <button type="button" class="calc-wide" data-digit="0">0</button>
    <button type="button" data-decimal>.</button>
    <button type="button" class="calc-equals" data-equals>=</button>
  </div>
</div>

<script src="/app.js?v=27"></script>
<script>
(function () {
  'use strict';
  function currencySymbolFor(code) {
    var match = (window.KC_CURRENCIES || []).filter(function (c) { return c.code === code; })[0];
    return match ? match.symbol : '$';
  }
  var form = document.getElementById('proposalForm');
  var slidesContainer = document.getElementById('slidesContainer');
  var previewContainer = document.getElementById('previewContainer');

  function debounce(fn, wait) {
    var t;
    return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, wait); };
  }

  function slideTemplate(n) {
    var div = document.createElement('div');
    div.className = 'slide-card';
    div.innerHTML =
      '<button type="button" class="slide-card-remove" title="Remove this slide" aria-label="Remove this slide">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>' +
      '</button>' +
      '<div class="slide-card-badge">Slide ' + (n + 1) + ' pricing</div>' +
      '<div class="row">' +
        '<div class="field"><label>Number of licenses</label><input type="number" class="f-licenses" min="1" placeholder="e.g. 100"></div>' +
        '<div class="field"><label>Products</label>' +
          '<select class="f-categoryTier" required>' + KCProducts.optionsHtml() + '</select>' +
        '</div>' +
        '<div class="field"><label>Special discount %</label><input type="number" class="f-specialDiscountPct" min="0" max="99" step="0.01" placeholder="0"></div>' +
      '</div>' +
      '<div class="hint" style="margin-bottom:1rem;">Filling in licenses, product, and special discount auto-calculates the fields below — every one of them stays editable if you need to override the engine\'s numbers.</div>' +
      '<div class="row">' +
        '<div class="field"><label>Category label (optional override)</label><input type="text" class="f-categoryDisplayLabel" placeholder="e.g. 3 Categories"></div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Cost/User (1-Year Term)</label><input type="number" step="0.01" class="f-costPerUser1Yr"></div>' +
        '<div class="field"><label>After-discount cost/user</label><input type="number" step="0.01" class="f-afterDiscountCostPerUser"></div>' +
        '<div class="field"><label>Sub-Total</label><input type="number" step="0.01" class="f-subTotal"></div>' +
      '</div>' +
      '<label class="checkbox-row"><input type="checkbox" class="f-includeMultiYearTerms" checked> Include Multi-Year Terms</label>' +
      '<div class="row">' +
        '<div class="field"><label>2-Year term %</label><input type="number" class="f-pct2yr" value="20"></div>' +
        '<div class="field"><label>3-Year term %</label><input type="number" class="f-pct3yr" value="30"></div>' +
        '<div class="field"><label>5-Year term %</label><input type="number" class="f-pct5yr" value="40"></div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Special note (optional)</label><input type="text" class="f-specialNote" placeholder="e.g. This offer is valid for a limited time"></div>' +
      '</div>' +
      '<div class="hint">Shown as bold text directly below this slide\'s pricing table, in the preview and the generated deck.</div>';
    return div;
  }

  function renumberSlides() {
    Array.from(slidesContainer.children).forEach(function (card, i) {
      card.querySelector('.slide-card-badge').textContent = 'Slide ' + (i + 1) + ' pricing';
    });
  }

  var calcCache = new Map();
  async function calculateRow(licenses, categoryTier, specialDiscountPct) {
    var key = JSON.stringify([licenses, categoryTier, specialDiscountPct]);
    if (calcCache.has(key)) return calcCache.get(key);
    var r = await KCApi.post('/calculate-row', { licenses: licenses, categoryTier: categoryTier, specialDiscountPct: specialDiscountPct, nonProfit: false });
    if (r.status > 0) calcCache.set(key, r.data); // a dropped connection isn't remembered
    return r.data;
  }

  // Filling in licenses + category tier + special discount auto-fills the
  // calculated fields with the engine's defaults — but those fields stay plain
  // editable inputs, so typing into them directly overrides the default and
  // sticks until the next time one of the three trigger fields changes.
  var lastCalcError = null; // shown above the preview when a typed value is rejected
  async function autoCalcSlide(card) {
    var licenses = Math.floor(Number(card.querySelector('.f-licenses').value));
    var categoryTier = card.querySelector('.f-categoryTier').value;
    var discountPct = Number(card.querySelector('.f-specialDiscountPct').value) || 0;
    if (!licenses || !categoryTier) return;

    var data = await calculateRow(licenses, categoryTier, discountPct);
    if (data.error) {
      lastCalcError = data.error;
      scheduleRecalc();
      return;
    }
    lastCalcError = null;
    card.querySelector('.f-costPerUser1Yr').value = data.costPerUser1Yr;
    card.querySelector('.f-afterDiscountCostPerUser').value = data.afterDiscountCostPerUser;
    card.querySelector('.f-subTotal').value = data.subTotal;
    card.setAttribute('data-calculated-label', data.categoryDisplayLabel);
    if (!card.querySelector('.f-categoryDisplayLabel').value) {
      card.querySelector('.f-categoryDisplayLabel').placeholder = data.categoryDisplayLabel;
    }
    // Programmatic .value assignment doesn't fire input/change, so the debounced
    // recalc from the user's own keystroke won't see these freshly-filled values
    // unless we explicitly ask for another pass once they land.
    scheduleRecalc();
  }

  function addSlide() {
    var card = slideTemplate(slidesContainer.children.length);
    slidesContainer.appendChild(card);
    card.querySelector('.slide-card-remove').addEventListener('click', function () {
      card.remove();
      renumberSlides();
      scheduleRecalc();
    });
    card.querySelectorAll('input, select').forEach(function (el) {
      el.addEventListener('input', scheduleRecalc);
      el.addEventListener('change', scheduleRecalc);
    });
    card.querySelectorAll('.f-licenses, .f-categoryTier, .f-specialDiscountPct').forEach(function (el) {
      el.addEventListener('input', function () { autoCalcSlide(card); });
      el.addEventListener('change', function () { autoCalcSlide(card); });
    });
    scheduleRecalc();
  }

  document.getElementById('addSlideBtn').addEventListener('click', addSlide);

  function buildSlideFromCard(card) {
    var licenses = Math.floor(Number(card.querySelector('.f-licenses').value));
    var costPerUser1Yr = Number(card.querySelector('.f-costPerUser1Yr').value) || 0;
    var afterDiscountCostPerUser = Number(card.querySelector('.f-afterDiscountCostPerUser').value) || 0;
    var subTotal = Number(card.querySelector('.f-subTotal').value) || 0;
    if (!licenses || licenses < 1 || !subTotal || subTotal < 0) return null;

    var multiYearPct = {
      '2yr': Number(card.querySelector('.f-pct2yr').value) || 0,
      '3yr': Number(card.querySelector('.f-pct3yr').value) || 0,
      '5yr': Number(card.querySelector('.f-pct5yr').value) || 0,
    };
    var multiYear = {
      '2yr': subTotal * (1 - multiYearPct['2yr'] / 100),
      '3yr': subTotal * (1 - multiYearPct['3yr'] / 100),
      '5yr': subTotal * (1 - multiYearPct['5yr'] / 100),
    };

    return {
      rows: [{
        licenses: licenses,
        categoryDisplayLabel: card.querySelector('.f-categoryDisplayLabel').value || card.getAttribute('data-calculated-label') || '—',
        costPerUser1Yr: costPerUser1Yr,
        afterDiscountCostPerUser: afterDiscountCostPerUser,
        subTotal: subTotal,
        specialDiscountPct: costPerUser1Yr ? 1 - (afterDiscountCostPerUser / costPerUser1Yr) : 0,
      }],
      combinedSubTotal: subTotal,
      multiYear: multiYear,
      multiYearPct: multiYearPct,
      includeMultiYearTerms: card.querySelector('.f-includeMultiYearTerms').checked,
      includeDiscountColumn: afterDiscountCostPerUser !== costPerUser1Yr,
      specialNote: card.querySelector('.f-specialNote').value.trim() || undefined,
    };
  }

  function recalcPreview() {
    var slides = Array.from(slidesContainer.children).map(buildSlideFromCard).filter(Boolean);
    // The cover slide always renders — only pricing slides wait on real data.
    window.KCPreview.render(previewContainer, {
      companyName: document.getElementById('companyName').value,
      proposalDate: document.getElementById('proposalDate').value,
      currencySymbol: currencySymbolFor(document.getElementById('currencyCode').value),
      slides: slides,
      notice: lastCalcError,
    });
  }

  var scheduleRecalc = debounce(recalcPreview, 350);
  form.addEventListener('input', scheduleRecalc);
  form.addEventListener('change', scheduleRecalc);

  window.addEventListener('DOMContentLoaded', function () { KCProducts.load().then(function () { addSlide(); }); });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var slides = Array.from(slidesContainer.children).map(buildSlideFromCard).filter(Boolean);
    if (!slides.length) {
      alert('Fill in at least one pricing slide (licenses and Sub-Total) before generating.');
      return;
    }
    await KCApi.download('/generate-manual', {
      companyName: document.getElementById('companyName').value,
      proposalDate: document.getElementById('proposalDate').value,
      currencyCode: document.getElementById('currencyCode').value,
      slides: slides,
    }, document.getElementById('companyName').value, form.querySelector('button[type="submit"]'));
  });
})();
</script>
</body>
</html>
