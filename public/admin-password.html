<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — KnowledgeCity Proposal Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/styles.css?v=17">
</head>
<body>
<button class="theme-toggle-fab" id="themeToggle" data-icon="moon" aria-label="Switch to dark mode"></button>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><img src="/img/kc-icon.png" alt=""><span class="logo-text">KnowledgeCity</span></div>
    <nav>
      <a href="/index.html"><span class="nav-icon" data-icon="document"></span><span class="nav-label">Standard Proposal</span></a>
      <a href="/multi-category.html"><span class="nav-icon" data-icon="layers"></span><span class="nav-label">Holistic Calculation (Proposal)</span></a>
      <a href="/manual.html"><span class="nav-icon" data-icon="edit"></span><span class="nav-label">Manual Proposal</span></a>
      <a href="/admin" class="active"><span class="nav-icon" data-icon="settings"></span><span class="nav-label">Admin Panel</span></a>
    </nav>
    <a class="sidebar-help-link" href="/index.html"><span class="nav-icon" data-icon="arrowLeft"></span><span class="nav-label">Back to public app</span></a>
    <div class="sidebar-watermark">Powered by KC RevOps</div>
  </aside>
  <main class="main">
    <div class="admin-tabs">
      <a href="/admin" class="admin-tab">Pricing configuration</a>
      <a href="/admin/password" class="admin-tab active">Change password</a>
    </div>

    <form id="passwordForm" style="max-width: 420px;">
      <div class="row">
        <div class="field"><label>Current password</label><input type="password" id="currentPassword" required autocomplete="current-password"></div>
      </div>
      <div class="row">
        <div class="field"><label>New password</label><input type="password" id="newPassword" minlength="8" required autocomplete="new-password"></div>
      </div>
      <div class="hint" style="margin-bottom: 1rem;">Must be at least 8 characters.</div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">Update password</button>
      </div>
      <div id="passwordStatus" style="margin-top:0.5rem; text-align:center;"></div>
    </form>
  </main>
</div>
<script src="/app.js?v=12"></script>
<script>
(async function () {
  var checkRes = await fetch('/admin/config');
  if (checkRes.status === 401 || checkRes.redirected) { location.href = '/admin/login'; return; }

  document.getElementById('passwordForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var status = document.getElementById('passwordStatus');
    var res = await fetch('/admin/change-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        currentPassword: document.getElementById('currentPassword').value,
        newPassword: document.getElementById('newPassword').value,
      }),
    });
    if (res.ok) {
      status.textContent = 'Password updated.'; status.style.color = '#3fb950';
      document.getElementById('passwordForm').reset();
    } else {
      var err = await res.json();
      status.textContent = err.error; status.style.color = '#e2554a';
    }
  });
})();
</script>
</body>
</html>
