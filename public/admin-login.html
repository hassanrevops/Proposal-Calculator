<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login — KnowledgeCity QuoteHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/img/kc-icon.png">
<link rel="stylesheet" href="/styles.css?v=28">
<script src="/app.js?v=27" defer></script>
</head>
<body>
<button class="theme-toggle-fab" id="themeToggle" data-icon="moon" aria-label="Switch to dark mode"></button>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" data-variant="public" data-nav="admin"></aside>

  <main class="main">
    <div class="login-card" style="margin-top: 4rem;">
      <img src="/img/kc-icon.png" alt="" class="login-card-icon">
      <div class="login-card-brand">KnowledgeCity</div>
      <form id="loginForm">
        <div class="field" style="margin-bottom:1.25rem;">
          <label>Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </div>
        <p id="loginError" style="color:#e2554a; display:none; margin-top:0.75rem; text-align:center;">Incorrect password.</p>
      </form>
    </div>
  </main>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var res = await fetch('/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: document.getElementById('password').value }),
  });
  if (res.ok) { location.href = '/admin'; }
  else { document.getElementById('loginError').style.display = 'block'; }
});
</script>
</body>
</html>
